name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsp
          POSTGRES_PASSWORD: yourRealPassword123
          POSTGRES_DB: dsp_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Ensure demo model artifact exists
        run: |
          python -c "
          from pathlib import Path
          from src.train import train_model
          if not Path('models/fraud_model.joblib').exists():
              from src.make_demo_files import make_demo_files
              make_demo_files(num_clean_batches=2, rows_per_batch=10, include_error_in_raw=False)
          "

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://dsp:yourRealPassword123@localhost:5432/dsp_app
        run: |
          pytest

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Model Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: model_service/Dockerfile
          push: false
          tags: fraud-api:ci

      - name: Build WebApp Streamlit Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: webapp/Dockerfile
          push: false
          tags: fraud-webapp:ci

      - name: Build Airflow Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: airflow/Dockerfile
          push: false
          tags: fraud-airflow:ci
