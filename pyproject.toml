[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "airflow/logs",
    "src/gx/gx/uncommitted",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "UP017", # datetime.timezone.utc vs datetime.UTC compatibility
    "E402",  # module level import not at top of file (needed for sys.path modifications in scripts/dags)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
