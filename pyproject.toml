[project]
name = "credit-card-fraud-detection"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["gx_project", "airflow/logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]  # FastAPI uses function calls (Depends, Query) as default arguments

[tool.ruff.lint.isort]
known-first-party = ["fraud_pipeline", "model_service", "api_client"]
known-third-party = ["airflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
