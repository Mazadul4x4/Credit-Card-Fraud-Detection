services:
  db:
    image: postgres:16
    container_name: fraud_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourRealPassword123}
      POSTGRES_DB: ${POSTGRES_DB:-dsp_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-airflow-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsp} -d ${POSTGRES_DB:-dsp_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: model_service/Dockerfile
    container_name: fraud_api
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dsp}:${POSTGRES_PASSWORD:-yourRealPassword123}@db:5432/${POSTGRES_DB:-dsp_app}
      MODEL_PATH: /app/models/fraud_model.joblib
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: fraud_webapp
    restart: always
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-dsp}:${POSTGRES_PASSWORD:-yourRealPassword123}@db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER:-dsp}:${POSTGRES_PASSWORD:-yourRealPassword123}@db:5432/${POSTGRES_DB:-dsp_app}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API_AUTH__JWT_SECRET: 23afb37d11ea439d502d283d0bb99afebb78e63af3c94ab08f3b69e16f5f440b
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    command: >
      bash -c "
      airflow db migrate
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_webserver
    restart: always
    depends_on:
      - airflow-init
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-dsp}:${POSTGRES_PASSWORD:-yourRealPassword123}@db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER:-dsp}:${POSTGRES_PASSWORD:-yourRealPassword123}@db:5432/${POSTGRES_DB:-dsp_app}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: 23afb37d11ea439d502d283d0bb99afebb78e63af3c94ab08f3b69e16f5f440b
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    command: api-server

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_scheduler
    restart: always
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-dsp}:${POSTGRES_PASSWORD:-yourRealPassword123}@db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER:-dsp}:${POSTGRES_PASSWORD:-yourRealPassword123}@db:5432/${POSTGRES_DB:-dsp_app}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: 23afb37d11ea439d502d283d0bb99afebb78e63af3c94ab08f3b69e16f5f440b
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    command: scheduler

  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_dag_processor
    restart: always
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-dsp}:${POSTGRES_PASSWORD:-yourRealPassword123}@db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER:-dsp}:${POSTGRES_PASSWORD:-yourRealPassword123}@db:5432/${POSTGRES_DB:-dsp_app}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: 23afb37d11ea439d502d283d0bb99afebb78e63af3c94ab08f3b69e16f5f440b
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    command: dag-processor

volumes:
  postgres_data: